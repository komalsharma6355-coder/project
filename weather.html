<!DOCTYPE html>
<html>
<head>
<title>Weather App (No API)</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
}

input{
padding:10px;
width:200px;
}

button{
padding:10px;
background:blue;
color:white;
border:none;
cursor:pointer;
}

.card{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
}
</style>
</head>

<body>

<h1>Weather App 🌦️</h1>

<input id="city" placeholder="Enter city (e.g. surat)">
<button onclick="getWeather()">Search</button>

<div class="card" id="result"></div>

<script>

async function getWeather(){

let city=document.getElementById("city").value;

if(city===""){
alert("Enter city name");
return;
}

// STEP 1: Get coordinates from city
let geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}`);
let geoData = await geo.json();

if(!geoData.results){
document.getElementById("result").innerHTML="City not found ❌";
return;
}

let lat = geoData.results[0].latitude;
let lon = geoData.results[0].longitude;

// STEP 2: Get weather
let weather = await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`
);

let data = await weather.json();

let temp = data.current_weather.temperature;
let wind = data.current_weather.windspeed;

document.getElementById("result").innerHTML =
`<h2>${city.toUpperCase()}</h2>
<p>🌡 Temperature: ${temp}°C</p>
<p>💨 Wind Speed: ${wind} km/h</p>`;

}

</script>

</body>
</html>
